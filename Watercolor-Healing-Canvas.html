<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>水彩与墨水疗愈画板</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: #fdfbf7; -webkit-user-select: none; user-select: none; }
#toolbar { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(0,0,0,0.06); box-shadow: 0 2px 12px rgba(0,0,0,0.05); flex-wrap: wrap;}
.mode-btn { border: 1px solid #ccc; border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; background: #fff; color: #333; transition: 0.2s; margin-right: 5px;}
.mode-btn.active { background: #333; color: #fff; border-color: #333; }
.palette-btn { border: 2px solid transparent; border-radius: 20px; padding: 6px 12px; font-size: 13px; cursor: pointer; color: #4a4a52; background: #f0eef2; transition: all .2s; display: flex; align-items: center; gap: 6px; }
.palette-btn.active { border-color: #7f8fa6; background: #fff; }
.color-dots { display: flex; gap: 2px; }
.dot { width: 10px; height: 10px; border-radius: 50%; }
/* 墨水色系 */
.p-ink .dot:nth-child(1) { background: #1a1a1a; } .p-ink .dot:nth-child(2) { background: #2c3e50; } .p-ink .dot:nth-child(3) { background: #4a2c2a; }
.p-blue .dot:nth-child(1) { background: #1b3a4b; } .p-blue .dot:nth-child(2) { background: #2b4c6f; } .p-blue .dot:nth-child(3) { background: #0f283d; }
.p-warm .dot:nth-child(1) { background: #8b4513; } .p-warm .dot:nth-child(2) { background: #a0522d; } .p-warm .dot:nth-child(3) { background: #5c2e1a; }
/* 水彩色系：全部改成同色系内的邻近色 */
.p-spring .dot:nth-child(1) { background: #F6C6D2; } .p-spring .dot:nth-child(2) { background: #FADCE4; } .p-spring .dot:nth-child(3) { background: #EDB9D8; }
.p-ocean .dot:nth-child(1) { background: #B7D9E4; } .p-ocean .dot:nth-child(2) { background: #A9D3E8; } .p-ocean .dot:nth-child(3) { background: #A0D8C8; }
.p-sunset .dot:nth-child(1) { background: #FFC2A1; } .p-sunset .dot:nth-child(2) { background: #FFD9A3; } .p-sunset .dot:nth-child(3) { background: #F9B6A0; }

.color-box { display: flex; align-items: center; gap: 6px; margin-left: auto; }
#colorPicker { width: 32px; height: 32px; border: none; border-radius: 8px; background: none; cursor: pointer; padding: 0; }
#hexInput { width: 80px; padding: 6px 8px; border-radius: 8px; border: 1px solid #ddd; font-size: 13px; outline: none; color: #444; }
#clearBtn { border: 1px solid #ddd; background: #fff; border-radius: 20px; padding: 7px 14px; font-size: 13px; color: #6b6b76; cursor: pointer; }
#canvas { position: fixed; top: 0; left: 0; touch-action: none; cursor: crosshair; }
</style>
</head>
<body>
<div id="toolbar">
  <div>
    <button class="mode-btn active" id="modeInk">🖤 墨水模式</button>
    <button class="mode-btn" id="modeColor">🎨 水彩模式</button>
  </div>
  <div id="paletteContainer" style="display:flex; gap:5px;">
  </div>
  <div class="color-box">
    <label>自定义</label>
    <input type="color" id="colorPicker" value="#2c3e50">
    <input type="text" id="hexInput" placeholder="#2c3e50" maxlength="7">
  </div>
  <button id="clearBtn">清空</button>
</div>
<canvas id="canvas"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    canvas.width = Math.round(w * DPR); canvas.height = Math.round(h * DPR);
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  var PALETTES = {
    ink:  { type: 'ink', list: ['#1a1a1a', '#2c3e50', '#4a2c2a'] },
    blue: { type: 'ink', list: ['#1b3a4b', '#2b4c6f', '#0f283d'] },
    warm: { type: 'ink', list: ['#8b4513', '#a0522d', '#5c2e1a'] },
    spring: { type: 'color', list: ['#F6C6D2', '#FADCE4', '#EDB9D8'] }, // 全部偏粉紫
    ocean:  { type: 'color', list: ['#B7D9E4', '#A9D3E8', '#A0D8C8'] }, // 全部偏青蓝
    sunset: { type: 'color', list: ['#FFC2A1', '#FFD9A3', '#F9B6A0'] }  // 全部偏暖橙
  };

  var currentMode = 'ink';
  var currentPaletteKey = 'ink';
  var currentColor = '#2c3e50';
  var currentRGB = hexToRgb(currentColor);
  var useCustomColor = false;

  var paletteContainer = document.getElementById('paletteContainer');
  function renderPalettes() {
    paletteContainer.innerHTML = '';
    var keys = currentMode === 'ink' ? ['ink', 'blue', 'warm'] : ['spring', 'ocean', 'sunset'];
    var labels = currentMode === 'ink' ? ['经典黑墨', '钢笔墨蓝', '复古褐墨'] : ['粉雾花海', '静谧海洋', '落日余晖'];
    
    keys.forEach(function(key, index) {
      var btn = document.createElement('button');
      btn.className = 'palette-btn p-' + key + (currentPaletteKey === key && !useCustomColor ? ' active' : '');
      btn.innerHTML = '<div class="color-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>' + labels[index];
      btn.onclick = function() {
        useCustomColor = false;
        currentPaletteKey = key;
        renderPalettes();
      };
      paletteContainer.appendChild(btn);
    });
  }

  function setMode(mode) {
    currentMode = mode;
    document.getElementById('modeInk').classList.toggle('active', mode === 'ink');
    document.getElementById('modeColor').classList.toggle('active', mode === 'color');
    currentPaletteKey = mode === 'ink' ? 'ink' : 'spring';
    useCustomColor = false;
    renderPalettes();
  }

  document.getElementById('modeInk').addEventListener('click', function() { setMode('ink'); });
  document.getElementById('modeColor').addEventListener('click', function() { setMode('color'); });

  function hexToRgb(hex) {
    var h = hex.replace('#', '');
    if (h.length === 3) h = h.charAt(0)+h.charAt(0)+h.charAt(1)+h.charAt(1)+h.charAt(2)+h.charAt(2);
    var num = parseInt(h, 16);
    return [num >> 16 & 255, num >> 8 & 255, num & 255];
  }

  function pickColor() {
    if (useCustomColor) return currentRGB;
    var palette = PALETTES[currentPaletteKey];
    return hexToRgb(palette.list[Math.floor(Math.random() * palette.list.length)]);
  }

  document.getElementById('colorPicker').addEventListener('input', function (e) {
    useCustomColor = true; currentColor = e.target.value; currentRGB = hexToRgb(currentColor);
    document.getElementById('hexInput').value = currentColor;
    renderPalettes();
  });
  document.getElementById('hexInput').addEventListener('change', function (e) {
    var v = e.target.value.trim();
    if (/^#?[0-9a-fA-F]{6}$/.test(v)) {
      if (v.charAt(0) !== '#') v = '#' + v;
      useCustomColor = true; currentColor = v.toLowerCase(); currentRGB = hexToRgb(currentColor);
      document.getElementById('colorPicker').value = currentColor;
      renderPalettes();
    } else { e.target.value = currentColor; }
  });
  document.getElementById('clearBtn').addEventListener('click', function () {
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.restore();
  });

  var drawing = false;
  var activePointerId = null;
  var startTime = 0;
  var curX = 0, curY = 0;
  var lastX = null, lastY = null;
  var timer = null;
  var rafId = null;
  var shapeSeed = null;
  var lockedRGB = null;

  var MIN_R = 25;    
  var MAX_R = 160;  
  var MAX_MS = 10000; 

  function getPos(e) {
    var rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function generateShapeSeed(isInkMode) {
    if (isInkMode) {
      return { freq1: 1+Math.random()*2, freq2: 3+Math.random()*3, freq3: 6+Math.random()*4, freq4: 10+Math.random()*6, phase1: Math.random()*6.28, phase2: Math.random()*6.28, phase3: Math.random()*6.28, phase4: Math.random()*6.28 };
    } else {
      return { freq1: 1+Math.random()*1.5, freq2: 2+Math.random()*2, freq3: 3+Math.random()*2, freq4: 0, phase1: Math.random()*6.28, phase2: Math.random()*6.28, phase3: Math.random()*6.28, phase4: 0 };
    }
  }

  function traceDropPath(x, y, r, spread, isInkMode) {
    var n = 20; 
    var pts = [];
    var seed = shapeSeed;

    for (var i = 0; i < n; i++) {
      var a = (Math.PI * 2 * i) / n;
      var wave1, wave2, wave3, wave4;
      
      if (isInkMode) {
        wave1 = Math.sin(a * seed.freq1 + seed.phase1) * 0.15;
        wave2 = Math.sin(a * seed.freq2 + seed.phase2) * 0.08;
        wave3 = Math.sin(a * seed.freq3 + seed.phase3) * 0.04;
        wave4 = Math.sin(a * seed.freq4 + seed.phase4) * 0.02;
      } else {
        wave1 = Math.sin(a * seed.freq1 + seed.phase1) * 0.08;
        wave2 = Math.sin(a * seed.freq2 + seed.phase2) * 0.04;
        wave3 = Math.sin(a * seed.freq3 + seed.phase3) * 0.02;
        wave4 = 0;
      }
      
      var rad = 1.0 + (wave1 + wave2 + wave3 + wave4) * spread;
      pts.push({ x: x + Math.cos(a) * rad * r, y: y + Math.sin(a) * rad * r });
    }
    
    ctx.beginPath();
    ctx.moveTo((pts[0].x + pts[n-1].x)/2, (pts[0].y + pts[n-1].y)/2);
    for (var i = 0; i < n; i++) {
      var cur = pts[i], nxt = pts[(i+1)%n];
      ctx.quadraticCurveTo(cur.x, cur.y, (cur.x + nxt.x)/2, (cur.y + nxt.y)/2);
    }
    ctx.closePath();
  }

  function drawBlob(x, y, r, rgb, spread) {
    var isInkMode = (currentMode === 'ink');
    var grad = ctx.createRadialGradient(x, y, 0, x, y, r);
    
    if (isInkMode) {
      grad.addColorStop(0, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',0.8)');
      grad.addColorStop(0.7, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',0.3)');
      grad.addColorStop(1, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',0.6)'); 
      ctx.globalAlpha = 0.4; 
      ctx.globalCompositeOperation = 'source-over'; 
    } else {
      // 🌟 水彩模式：改用柔光模式（soft-light），颜色越叠越透亮，绝不发灰
      grad.addColorStop(0, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',0.7)');
      grad.addColorStop(0.6, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',0.5)');
      grad.addColorStop(1, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',0.05)'); 
      ctx.globalAlpha = 0.8; 
      ctx.globalCompositeOperation = 'soft-light'; // 🌟 柔光混合，保留通透感
    }
    
    ctx.fillStyle = grad;
    traceDropPath(x, y, r, spread, isInkMode);
    ctx.fill();
    
    ctx.globalAlpha = 1.0;
    ctx.globalCompositeOperation = 'source-over';
  }

  function loop() {
    if (!drawing) return;
    var dt = performance.now() - startTime;
    var progress = Math.min(1, dt / MAX_MS);
    var easeOut = 1 - Math.exp(-progress * 3); 
    
    var radius = MIN_R + easeOut * (MAX_R - MIN_R);
    var spread = easeOut; 
    
    drawBlob(curX, curY, radius, lockedRGB, spread);
    
    rafId = requestAnimationFrame(function () {
      timer = setTimeout(loop, 80); 
    });
  }

  function startDrawing(e) {
    if (e.target.closest('#toolbar')) return;
    if (activePointerId !== null) return;
    e.preventDefault();
    activePointerId = e.pointerId;
    var pos = getPos(e);
    drawing = true;
    startTime = performance.now();
    curX = pos.x; curY = pos.y;
    lastX = null; lastY = null;
    
    lockedRGB = pickColor(); 
    shapeSeed = generateShapeSeed(currentMode === 'ink');
    
    drawBlob(curX, curY, MIN_R, lockedRGB, 0);
    lastX = curX; lastY = curY;

    if (timer) clearTimeout(timer);
    if (rafId) cancelAnimationFrame(rafId);
    timer = setTimeout(loop, 80);
  }

  function stopDrawing(e) {
    if (e && e.pointerId !== activePointerId) return;
    if (!drawing) return;
    drawing = false;
    activePointerId = null;
    if (timer) { clearTimeout(timer); timer = null; }
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  }

  canvas.addEventListener('pointerdown', startDrawing);
  canvas.addEventListener('pointermove', function (e) {
    if (!drawing || e.pointerId !== activePointerId) return;
    var pos = getPos(e);
    if (lastX !== null) {
      var dist = Math.hypot(pos.x - lastX, pos.y - lastY);
      if (dist > 15) {
        var dragSeed = generateShapeSeed(currentMode === 'ink');
        var oldSeed = shapeSeed;
        shapeSeed = dragSeed; 
        drawBlob(pos.x, pos.y, MIN_R + 8, lockedRGB, 0.3); 
        shapeSeed = oldSeed; 
        lastX = pos.x; lastY = pos.y;
      }
    }
    curX = pos.x; curY = pos.y; 
  });
  canvas.addEventListener('pointerup', stopDrawing);
  canvas.addEventListener('pointercancel', stopDrawing);
  canvas.addEventListener('pointerleave', stopDrawing);
  canvas.addEventListener('touchstart', function (e) { e.preventDefault(); }, { passive: false });

  renderPalettes();
})();
</script>
</body>
</html>
